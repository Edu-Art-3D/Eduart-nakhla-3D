<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduArt 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      /* خلفية سوداء خاصة بالفضاء والنيازك */
      background-color: #000000;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* مكان اللوجو في الأعلى على اليمين */
    .brand-logo {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 65px;
      height: auto;
      z-index: 9999;
    }

    /* عرض المجسم الـ 3D مع خلفية سوداء */
    model-viewer {
      width: 100vw;
      height: calc(100vh - 80px);
      background-color: #000000;
    }

    /* الشريط الذهبي السفلي */
    .gold-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(135deg, #d4af37 0%, #ffdf73 50%, #aa771c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 -4px 15px rgba(212, 175, 55, 0.4);
      z-index: 998;
      border-top: 2px solid #fff3a6;
    }

    .gold-bar-content {
      color: #3b270c;
      font-weight: bold;
      font-size: 1.1rem;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.4);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- صورة اللوجو -->
  <img src="logo.PNG" alt="EduArt Logo" class="brand-logo">

  <!-- عرض المجسم الـ 3D -->
  <model-viewer 
    id="modelViewer"
    src="nakhla.glb" 
    alt="EduArt 3D Model" 
    camera-controls 
    ar 
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    scale="50 50 50">
  </model-viewer>

  <!-- الشريط الذهبي في الأسفل -->
  <div class="gold-bar">
    <div class="gold-bar-content">✨ EduArt Space & Meteorites Collection ✨</div>
  </div>

  <script>
    // حماية إضافية للتحقق من المفتاح السري لو تم فتحه بشكل مباشر
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const key = urlParams.get('key');
      const SECRET_KEY = "EduArt_xK9_vP9426_Secured_Tokenh_99";
      const TRAP_PAGE_URL = "https://edu-art-3d-book.my.canva.site/space-trap";

      if (key !== SECRET_KEY) {
        window.location.href = TRAP_PAGE_URL;
      }
    })();
  </script>

</body>
</html>
